# Test harness: a throwaway Postgres + pgvector and Node 24 (the production runtime).
# Run with `npm test` (scripts/test.sh), which also tears everything down.
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: memory_test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d memory_test"]
      interval: 1s
      retries: 30

  test:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      TEST_DATABASE_URL: postgres://test:test@db:5432/memory_test
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm ci --omit=dev --no-audit --no-fund --loglevel=error && node --test --test-concurrency=1 'tests/**/*.test.ts'"
